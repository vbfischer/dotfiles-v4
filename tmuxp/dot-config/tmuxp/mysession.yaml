session_name: Dev Session

windows:
  - window_name: main
    layout: main-vertical
    focus: true
    options:
      main-pane-width: 65%
    panes:
      # Main development pane (left side)
      - focus: true
  - window_name: git
      - null 


# Keyboard shortcuts reminder:
# - Prefix + z: Zoom/unzoom current pane (hide other panes)
# - Prefix + space: Cycle through layouts
# - Prefix + {/}: Move pane left/right
# - Prefix + o: Jump between panes
# - Prefix + q: Show pane numbers
# - Prefix + x: Close pane
# - Prefix + !: Break pane into new window
# - Prefix + Alt+1-5: Select layout preset
